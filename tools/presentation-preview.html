<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мидгард — музыка и иконки</title>
<style>body{background:#18282d;color:#eee1c5;font:16px system-ui;max-width:1000px;margin:32px auto;padding:16px}button{background:#3f5960;color:#fff0ca;border:1px solid #a58d62;border-radius:6px;padding:12px;margin:4px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:12px}.tile{background:#26383e;padding:12px;text-align:center;border-radius:8px}.tile svg{width:64px;height:64px;display:block;margin:auto}.tile small{display:block}p{line-height:1.6}.sizes svg{width:24px;height:24px;display:inline-block;margin:8px}button[aria-pressed=true]{background:#657a4b}</style>
<h1>Мидгард</h1><p>Прослушивание трёх фоновых композиций и просмотр цветных иконок. Эта страница не читает и не изменяет сохранения игры.</p>
<div id="music"></div><button id="stop">Остановить музыку</button><p id="status">Выберите землю. На подготовку инструментов потребуется несколько секунд.</p>
<h2>Иконки в размере пояса</h2><div class="sizes" id="sizes"></div><h2>Детали предметов</h2><div class="grid" id="icons"></div>
<script type="module">
import {GameAudio} from '../src/audio.js';import {THEMES} from '../src/music.js';import {ICON_ART,icon} from '../src/icons.js';import {createGame,START,BOSSES,ITEMS,PARTS} from '../src/game.js';
const audio=new GameAudio({music:true,effects:false}),game=createGame(1);game.enemies=[];let playing=false;
const buttons=document.getElementById('music');
for(const [region,theme]of Object.entries(THEMES)){const button=document.createElement('button');button.textContent=theme.name;button.onclick=async()=>{Object.assign(game.player,region==='forest'?START:BOSSES.find(b=>b.biome===region));await audio.unlock();audio.set('music',true);playing=true;for(const node of buttons.children)node.setAttribute('aria-pressed',String(node===button));};buttons.append(button);}
document.getElementById('stop').onclick=()=>{playing=false;audio.set('music',false);};
for(const name of Object.keys(ICON_ART)){const tile=document.createElement('div');tile.className='tile';tile.innerHTML=icon(name)+`<small>${ITEMS[name]||PARTS[name]?.name||name}</small>`;document.getElementById('icons').append(tile);document.getElementById('sizes').insertAdjacentHTML('beforeend',icon(name));}
function frame(){audio.update(game,playing&&!document.hidden);document.getElementById('status').textContent=!playing?'Музыка остановлена':audio.musicReady?'Звучит самостоятельная инструментальная тема выбранной земли.':'Готовятся инструменты…';requestAnimationFrame(frame);}frame();
</script></html>
